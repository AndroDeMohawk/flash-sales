services:
  postgres:
    image: postgres:17-alpine
    container_name: flash_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-flash_sales}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flash_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.3.1
    container_name: flash_kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: flash_api
    restart: on-failure
    environment:
      - PORT=8888
      - DATABASE_URL=postgres://postgres:postgres@flash_postgres:5432/flash_sales?sslmode=disable
      - REDIS_ADDR=flash_redis:6379
      - KAFKA_BROKERS=flash_kafka:9092
    depends_on:
      - postgres
      - redis 
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker  # Укажите путь к Dockerfile для Worker
    container_name: flash_worker
    environment:
      - PORT=8889
      - REDIS_ADDR=flash_redis:6379
      - KAFKA_BROKERS=flash_kafka:9092
      - DATABASE_URL=postgres://postgres:postgres@flash_postgres:5432/flash_sales?sslmode=disable
    depends_on:
      - postgres
      - redis
      - kafka
  nginx:
    image: nginx:alpine
    container_name: flash_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api # Теперь Compose видит сервис api выше
volumes:
  pg_data:
  redis_data: